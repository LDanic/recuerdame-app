# Copia de ~/servers/recuerdame/docker-compose.yml en el servidor. Ver docs/despliegue.md.
services:
  recuerdame:
    build:
      context: /home/milo/recuerdame/server
      dockerfile: deploy/Dockerfile
    container_name: recuerdame
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    environment:
      RECUERDAME_DATOS: /data
      RECUERDAME_LLAVE: /secretos/llave
      RECUERDAME_VOZ: /voz/es_MX-laura-high.onnx
      RECUERDAME_GESTORES: ${RECUERDAME_GESTORES}  # en ~/servers/recuerdame/.env
      RECUERDAME_JWKS: http://127.0.0.1:9000/application/o/recuerdame/jwks/
    volumes:
      - /home/milo/recuerdame/server:/app:ro
      - /home/milo/recuerdame-data:/data
      - /home/milo/recuerdame-backups:/backups
      - /home/milo/servers/recuerdame/secretos:/secretos:ro  # la llave, fuera de datos y respaldos
      - /home/milo/servers/recuerdame/voz:/voz:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/v1/salud')"]
      interval: 60s
      timeout: 5s
